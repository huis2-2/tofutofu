camera_node:
  ros__parameters:
    device: /dev/video0
    width: 640
    height: 480
    fps: 30
    mjpg: true
    publish_raw: true
    publish_compressed: false   # record:=true 이면 launch 가 true 로 바꿈
    jpeg_quality: 80
    exposure: 0                 # 모션 블러 심하면 수동 노출값 (카메라마다 범위 다름)

encoder_node:
  ros__parameters:
    gpio_chip: /dev/gpiochip0
    line_a: 112
    line_b: 122
    reverse: true
    publish_rate: 50.0
    print_period: 0.0
    meters_per_pulse: 0.00412   # 실측: Total Pulses 변화량 x 0.00412 m
    neutral_us: 1680            # 방향 = /drive/throttle_us 가 이보다 크면 전진, 작으면 후진
    switch_stop_time: 0.1       # 바퀴가 이 시간 이상 멈춰 있을 때만 방향 전환 (주행 중 1680 아래 = 브레이크)
    stop_timeout: 0.3
    speed_filter_tau: 0.05

sllidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/ttyUSB0
    serial_baudrate: 115200     # A1/A2M8: 115200, A2M12/A3/S1: 256000, C1: 460800
    frame_id: laser
    inverted: false
    angle_compensate: true
    scan_mode: ''
