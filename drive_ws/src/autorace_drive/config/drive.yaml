drive_node:
  ros__parameters:
    dry_run: false
    # 하드웨어 (drive_record.py 에서 실차 확인된 값)
    i2c_bus: 7
    pca_address: 64        # 0x40
    pwm_freq: 300.0
    steering_channel: 8
    throttle_channel: 9
    mux_pin: 15            # 하드웨어 MUX SEL (BOARD 15번, 50Hz 10% → Jetson 제어). 0 = 사용 안 함
    rate: 50.0
    cmd_timeout: 0.3
    encoder_timeout: 0.3
    # 조향
    center_us: 1660.0
    left_us: 2000.0
    right_us: 1400.0
    max_left_rad: 0.349    # 실측 좌회전 최대 20도 (left_us 2000)
    max_right_rad: 0.401   # 실측 우회전 최대 23도 (right_us 1400)
    trim_us: 0.0           # 직진이 한쪽으로 쏠리면 조정
    # 속도 PID (엔코더 /encoder/speed 필요)
    neutral_us: 1680.0     # 실측 정지
    deadband_us: 85.0      # 실측 주행 시작 1765 - 정지 1680
    kff: 120.0             # TODO(실측) µs per m/s
    kp: 80.0
    ki: 120.0
    kd: 0.0
    i_limit: 120.0
    max_forward_us: 1950.0 # 실측 최고속 (처음 시험은 1850 정도로 낮춰서)
    brake_us: 1580.0       # TODO(확인) 정지 1680 보다 낮은 값 = 브레이크. 후진이 걸리면 1680 으로
    brake_speed: 0.10
    accel: 3.0
    stop_speed: 0.02
    open_loop: false       # true: 엔코더 없이 피드포워드만 (PID 튜닝 전 시험)
