drive_node:
  ros__parameters:
    dry_run: false
    # 하드웨어 (drive_record.py 에서 실차 확인된 값)
    i2c_bus: 7
    pca_address: 64        # 0x40
    pwm_freq: 300.0
    steering_channel: 8
    throttle_channel: 9
    mux_pin: 15            # 하드웨어 MUX SEL (BOARD 15번, 50Hz 10% → Jetson 제어). 0 = 사용 안 함
    rate: 50.0
    cmd_timeout: 0.3
    encoder_timeout: 0.3
    # 조향
    center_us: 1660.0
    left_us: 2000.0
    right_us: 1400.0
    max_left_rad: 0.45     # TODO(실측) left_us 일 때 앞바퀴 각도
    max_right_rad: 0.45    # TODO(실측) right_us 일 때 앞바퀴 각도
    trim_us: 0.0           # 직진이 한쪽으로 쏠리면 조정
    # 속도 PID (엔코더 /encoder/speed 필요)
    neutral_us: 1500.0
    deadband_us: 40.0      # TODO(실측) 바퀴가 막 돌기 시작하는 펄스 - 1500
    kff: 120.0             # TODO(실측) µs per m/s
    kp: 80.0
    ki: 120.0
    kd: 0.0
    i_limit: 120.0
    max_forward_us: 1750.0 # 안전 상한 (속도 올릴 때 같이 올리기, 절대 2000 이하)
    brake_us: 1350.0       # 정지 명령 시 브레이크 펄스 (ESC 가 후진 들어가면 1500 으로)
    brake_speed: 0.10
    accel: 3.0
    stop_speed: 0.02
    open_loop: false       # true: 엔코더 없이 피드포워드만 (PID 튜닝 전 시험)
