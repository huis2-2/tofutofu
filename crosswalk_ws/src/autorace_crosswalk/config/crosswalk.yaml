crosswalk_node:
  ros__parameters:
    trigger_dist: 1.0     # 앞바퀴→횡단보도 이 거리 안에서 미션 시작
    stop_before: 0.05     # 횡단보도 앞 가장자리에서 이만큼 앞에 앞바퀴 정지 (정지선 위치 맞춰 튜닝)
    use_stop_line: false  # true: horizontal_line(정지선)이 횡단보도보다 가까우면 그 선 기준
    decel: 1.5            # 감속 프로파일 m/s^2 (ESC 브레이크 성능에 맞게)
    creep_speed: 0.12
    creep_dist: 0.10
    tolerance: 0.01
    max_measure: 1.2      # 이보다 먼 측정은 오차가 커서 무시
    hold_sec: 3.5         # 규정 3초 이상
    pass_distance: 0.8    # 출발 후 이 거리 동안 다시 안 섬
    max_count: 1          # 보행자 미션 횡단보도는 1개 (0 = 무제한)
    signal_ignore_sec: 4.0
    lane_timeout: 0.3
